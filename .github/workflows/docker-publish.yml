---
name: Build and publish ProjectHub images

"on":
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test ProjectHub.slnx --configuration Release

  publish:
    needs: test
    runs-on: ubuntu-latest
    env:
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      API_IMAGE_NAME: >-
        ${{ vars.API_IMAGE_NAME || vars.IMAGE_NAME || 'projecthub-api' }}
      WEB_IMAGE_NAME: ${{ vars.WEB_IMAGE_NAME || 'projecthub-web' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate registry configuration
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [[ -z "$REGISTRY_HOST" ]]; then
            echo "::error::Set the REGISTRY_HOST Actions variable."
            exit 1
          fi
          if [[ -z "$REGISTRY_USERNAME" ]]; then
            echo "::error::Set the REGISTRY_USERNAME Actions secret."
            exit 1
          fi
          if [[ -z "$REGISTRY_PASSWORD" ]]; then
            echo "::error::Set the REGISTRY_PASSWORD Actions secret."
            exit 1
          fi

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ProjectHub.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.API_IMAGE_NAME }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ProjectHub.Web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.REGISTRY_HOST }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
