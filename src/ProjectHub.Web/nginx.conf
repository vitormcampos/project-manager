server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /_framework/ {
        try_files $uri =404;
    }

    location ^~ /_content/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
